# Deploys the page with the encrypted data.json handed in by the owner's Mac each hour.
# data.json is never committed, so this public repo keeps no history of the readings.
name: publish
on:
  workflow_dispatch:
    inputs:
      blob:
        description: Encrypted data.json (password protected, from the owner's Mac)
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The blob is read from the event file, not from env or the command line, so it never appears in the run log.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest icon.svg icon-180.png icon-512.png robots.txt .nojekyll _site/
          python3 - <<'PY'
          import json, os
          blob = json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']['blob']
          box = json.loads(blob)
          assert set(box) == {'v', 'kdf', 'iter', 'salt', 'iv', 'ct', 'mac'}, 'not an encrypted envelope'
          open('_site/data.json', 'w').write(blob)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
